# The in-game addons' Lua tests (stream/tests/test_wuui_*.lua: the Esc menu, the Leyline panels...) and the Dojo's
# realm script (test_ov_dojo.lua) on feature branches:
# Claude's cloud sessions have no Lua 5.1 to run them. No secrets, no release.
name: lua check

on:
  push:
    branches: ["feat-*"]
    paths:
      - "stream/fui-web/**"
      - "stream/tests/test_wuui_*.lua"
      - "tools/den-ui/**"
      - "stream/tests/test_ov_*.lua"
      - "realm/custom/lua_scripts/**"
      - "realm/profiles/main.env"
      - "realm/serverpass.sh"
      - "labs/den-lite/src/dojo.rs"
      - "stream/social.py"
      - "stream/tests/test_social.py"
      - ".github/workflows/lua-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: the Esc menu's, the Den editor's and the GM panel skin's tests (each file's own command, from its first line)
        run: |
          set -e
          for t in gamemenu gamemenu_fui leyline host hostsandbox builder denbar denhome gallery fillbars dojo denlayout gmskin; do
            f="stream/tests/test_wuui_$t.lua"
            cmd=$(head -1 "$f" | sed -n 's/^-- \(lua5\.1 .*\)$/\1/p')
            cmd=$(echo "$cmd" | sed 's/ \[[^]]*\]//g')
            echo "== $cmd"
            $cmd
          done
      - name: the main realm's ov_main.lua (riding from level 1 and .mount, the choice menu, the boost's bars and mounts)
        run: |
          set -e
          for t in start_mount main_choice main_bars; do
            f="stream/tests/test_ov_$t.lua"
            cmd=$(head -1 "$f" | sed -n 's/^-- \(lua5\.1 .*\)$/\1/p')
            echo "== $cmd"
            $cmd
          done
      - name: the main realm's other tweaks (quality of life, starting kit, events clock, duel ratings, name guard, armory)
        run: |
          set -e
          L=realm/custom/lua_scripts
          lua5.1 stream/tests/test_ov_qol.lua $L/ov_qol.lua
          lua5.1 stream/tests/test_ov_kits.lua $L/ov_main.lua
          lua5.1 stream/tests/test_ov_events.lua $L/ov_events.lua
          lua5.1 stream/tests/test_ov_duels.lua $L/ov_duels.lua
          lua5.1 stream/tests/test_ov_names.lua $L/ov_names.lua
          lua5.1 stream/tests/test_ov_armory.lua $L/ov_armory.lua
          lua5.1 stream/tests/test_ov_boost_rules.lua $L/ov_main.lua $L/ov_kits.lua
          python3 -I stream/tests/test_main_realm_config.py
          python3 -I stream/tests/test_realm_player_strings.py
      - name: the Dojo on the full Den (ov_dojo.lua under a fake mod-ale; its ring checked against Den Lite's dojo.rs)
        run: lua5.1 stream/tests/test_ov_dojo.lua realm/custom/lua_scripts/ov_dojo.lua labs/den-lite/src/dojo.rs
      - name: the website's friends and launcher link (test_social.py drives a Lua stand-in realm)
        run: python3 -I stream/tests/test_social.py stream/wrath_portal.py
      - name: the Den editor's own icons (64 x 64 32-bit TGA the client reads; in the pack and the stream)
        run: python3 tools/den-ui/icons/test_icons.py
