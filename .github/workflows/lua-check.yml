# The in-game addons' Lua tests (stream/tests/test_wuui_*.lua: the Esc menu, the Leyline panels...) on feature branches:
# Claude's cloud sessions have no Lua 5.1 to run them. No secrets, no release.
name: lua check

on:
  push:
    branches: ["feat-*"]
    paths:
      - "stream/fui-web/**"
      - "stream/tests/test_wuui_*.lua"
      - "stream/social.py"
      - "stream/tests/test_social.py"
      - ".github/workflows/lua-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: the Esc menu's and the Den editor's tests (each file's own command, from its first line)
        run: |
          set -e
          for t in gamemenu gamemenu_fui leyline host builder denbar denhome gallery fillbars; do
            f="stream/tests/test_wuui_$t.lua"
            cmd=$(head -1 "$f" | sed -n 's/^-- \(lua5\.1 .*\)$/\1/p')
            cmd=$(echo "$cmd" | sed 's/ \[[^]]*\]//g')
            echo "== $cmd"
            $cmd
          done
      - name: the website's friends and launcher link (test_social.py drives a Lua stand-in realm)
        run: python3 -I stream/tests/test_social.py stream/wrath_portal.py
