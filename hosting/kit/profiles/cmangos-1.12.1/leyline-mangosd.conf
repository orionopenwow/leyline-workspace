# Leyline host kit: applied on top of the core's own mangosd.conf.dist (run-server.sh).
# Paths inside the server image; /data is the host's own extracted client data (read-only).
DataDir = "/data"
LogsDir = "/logs"
# The server sits on the kit's internal Docker network (no route out, nothing published); only the agent reaches
# it, players come in through the relay.
BindIP = "0.0.0.0"
RealmID = 1
# No console in a container, no remote admin ports.
Console.Enable = 0
Ra.Enable = 0
SOAP.Enabled = 0
