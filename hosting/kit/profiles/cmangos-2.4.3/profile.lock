# Leyline host kit, "host any client": the cmangos-2.4.3 profile (a plain 2.4.3 realm on CMaNGOS TBC).
# Read by profiles/host-profile.sh and "profiles/Host a profile realm.bat" (KEY=VALUE lines only; nothing in this
# file is run) and passed to the Dockerfile as build args. Nothing here is ours and nothing here is game data: the
# server is compiled on the host's PC from its authors' source at these commits, the world database is the
# CMaNGOS project's own SQL at the pinned commit of its database repository (a git commit pins every byte).
# Bumping: change both commits together, then run the hosting tests (python3 -m unittest discover -s hosting/tests).

LL_PROFILE=cmangos-2.4.3
LL_CORE=cmangos
LL_BUILD=8606
LL_VERSION=2.4.3
LL_IMAGE=leyline-cmangos-243
LL_COMPOSE=docker-compose.cmangos-2.4.3.yml

# The server (GPL-2.0): CMaNGOS TBC.
LL_CORE_REPO=https://github.com/cmangos/mangos-tbc
LL_CORE_COMMIT=37767e954241e346453260b8bc8c1fb2e2afdf7d
# The world database (GPL-2.0, the project's InstallFullDB.sh): CMaNGOS tbc-db.
LL_DB_REPO=https://github.com/cmangos/tbc-db
LL_DB_COMMIT=1c54acd200540076c3078d22a66fd417d0f6dd60
LL_EXPANSION=TBC

# The host's own client: files that must be in the folder they pick, the world server's "ready" log line.
LL_CLIENT_FILES=Data/common.MPQ,Data/expansion.MPQ
LL_READY=World initialized
LL_BUILD_TIME=40-90 minutes and about 5 GB of disk
LL_EXTRACT_TIME=30-60 minutes, plus 1-3 hours for the monster paths
