# Leyline host kit: applied on top of the core's own authserver.conf.dist (run-server.sh).
LogsDir = "/logs"
BindIP = "0.0.0.0"
Updates.EnableDatabases = 0
# Every player reaches this server from the agent's address (the relay hides their IPs), so a per-IP wrong-password
# lock would lock everyone out at once. The relay limits wrong passwords per player IP.
WrongPass.MaxCount = 0
