# Leyline on Android (docs/ANDROID.md): the phone app, built from the same launcher (launcher/: Tauri 2, the UI in
# launcher/ui with the phone layout, the Rust core with mobile.rs), then started on an Android emulator.
#
#   apk:   the Android project is made fresh with `tauri android init` (gen/ is never committed), the app icon from the
#          Leyline crystal (stream/www-files/art/leyline-crystal-512.png), the full-screen activity from
#          launcher/src-tauri/mobile/android/MainActivity.kt; then a debug APK for arm64 phones and x86_64 emulators
#          (debug-signed: installs on any phone with "Install unknown apps" allowed). Artifact: leyline-android-debug.
#          With the release key in the repo's secrets (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD,
#          ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) also a release APK for arm64 and armv7 phones, signed with it.
#          Artifact: leyline-android-release. Without the secrets that part is skipped; nothing else needs them.
#   smoke: an Android 14 (API 34) x86_64 emulator installs the debug APK, starts it, takes a screenshot upright and
#          one sideways, and fails if the app crashed (launcher/scripts/android-smoke.sh). Artifact: android-smoke.
#   publish: only on main (a push or Run workflow), only once smoke passed: the APKs and their checksums go on the
#          rolling pre-release "android-latest", the download the website's /wrath/mobile page links (docs/MOBILE-RELEASE.md):
#            https://github.com/<this repo>/releases/download/android-latest/Leyline-debug.apk   (+ .sha256)
#            https://github.com/<this repo>/releases/download/android-latest/Leyline.apk         (with the release key)
#          Pull requests never publish. The only job with write access (contents: write, the built-in token).
#
# Runs in the PUBLIC repo orionopenwow/Leyline, beside leyline-launcher.yml. Source copy: tools/github-workflows/ in
# the workspace; "setup\Turn on GitHub builds.bat" puts it in Leyline's .github/workflows/. No game data: the app plays
# the browser game from the website, and nothing in this build reads or bundles game files.
name: leyline android
on:
  push:
    branches: [main]
    paths:
      - "launcher/**"
      - "stream/www-files/art/leyline-crystal-512.png"
      - ".github/workflows/leyline-android.yml"
  pull_request:
    paths:
      - "launcher/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leyline-android-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_API: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_NDK: "27.2.12479018"
  APP_ID: com.leylinelauncher.app

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: launcher/src-tauri
          key: android
      - name: Android SDK and NDK
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-$ANDROID_API" \
            "build-tools;$ANDROID_BUILD_TOOLS" "ndk;$ANDROID_NDK" >/dev/null
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "NDK_HOME=$sdk/ndk/$ANDROID_NDK" >> "$GITHUB_ENV"
          ls "$sdk/ndk/$ANDROID_NDK/toolchains/llvm/prebuilt"
      - name: Install the Tauri CLI
        working-directory: launcher
        run: npm ci --no-audit --no-fund
      - name: The Android project (tauri android init)
        working-directory: launcher
        run: |
          set -euo pipefail
          test ! -d src-tauri/gen/android || { echo "gen/android is committed: it must be made fresh here"; exit 1; }
          npx tauri android init   # non-interactive: GitHub sets CI=true
          # the full-screen activity, with the package line init wrote
          act=$(find src-tauri/gen/android/app/src/main -name MainActivity.kt | head -n 1)
          test -n "$act" || { echo "init made no MainActivity.kt"; exit 1; }
          pkg=$(grep -m1 '^package ' "$act")
          { echo "$pkg"; grep -v '^package ' src-tauri/mobile/android/MainActivity.kt; } > "$act.new"
          mv "$act.new" "$act"
          echo "MainActivity: $act ($pkg)"
          grep -n "applicationId\|minSdk" src-tauri/gen/android/app/build.gradle.kts || true
      - name: The app icon (the Leyline crystal)
        working-directory: launcher
        run: |
          npx tauri icon ../stream/www-files/art/leyline-crystal-512.png || echo "::warning::tauri icon failed, so the APK keeps Tauri's default icon"
      - name: Build the debug APK (arm64 and x86_64)
        working-directory: launcher
        run: |
          set -euo pipefail
          npx tauri android build --debug --apk --target aarch64 --target x86_64
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*debug*.apk' | head -n 1)
          test -n "$apk" || { echo "no debug APK was made"; exit 1; }
          mkdir -p ../dist-android
          cp "$apk" ../dist-android/Leyline-debug.apk
          (cd ../dist-android && sha256sum Leyline-debug.apk > Leyline-debug.apk.sha256 && cat Leyline-debug.apk.sha256)
      - name: No game data in the APK
        run: |
          set -euo pipefail
          if unzip -l dist-android/Leyline-debug.apk | grep -iE '\.(mpq|m2|wmo|adt|blp|dbc|skin)$'; then
            echo "game data in the APK"; exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leyline-android-debug
          path: dist-android/Leyline-debug.apk*
          if-no-files-found: error
      # release: only with the release key in the repo's secrets; otherwise the debug APK above is the one to install
      - name: Build and sign the release APK (arm64 and armv7)
        if: env.HAS_RELEASE_KEY == 'true'
        working-directory: launcher
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          npx tauri android build --apk --target aarch64 --target armv7
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n 1)
          test -n "$apk" || { echo "no release APK was made"; exit 1; }
          bt="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          ks="$RUNNER_TEMP/leyline-release.jks"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$ks"
          "$bt/zipalign" -p -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign --ks "$ks" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD --out ../dist-android/Leyline.apk "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" verify ../dist-android/Leyline.apk
          (cd ../dist-android && sha256sum Leyline.apk > Leyline.apk.sha256 && cat Leyline.apk.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: env.HAS_RELEASE_KEY == 'true'
        with:
          name: leyline-android-release
          path: dist-android/Leyline.apk*
          if-no-files-found: error

  smoke:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: leyline-android-debug
          path: apk
      - name: Hardware acceleration for the emulator (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the app on an Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash launcher/scripts/android-smoke.sh apk/Leyline-debug.apk android-smoke com.leylinelauncher.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-smoke
          path: android-smoke/
          if-no-files-found: warn

  publish:
    needs: [apk, smoke]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: leyline-android-*
          path: dist-android
          merge-multiple: true
      - name: Put the APKs on android-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist-android
          ls -la
          test -f Leyline-debug.apk || { echo "no debug APK to publish"; exit 1; }
          sha256sum -c Leyline-debug.apk.sha256
          if [ -f Leyline.apk ]; then sha256sum -c Leyline.apk.sha256; fi
          if unzip -l Leyline-debug.apk | grep -iE '\.(mpq|m2|wmo|adt|blp|dbc|skin)$'; then echo "game data in the APK"; exit 1; fi
          if ! gh release view android-latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create android-latest -R "$GITHUB_REPOSITORY" --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Leyline for Android (latest)" \
              --notes "The Leyline app for Android phones, built by CI from launcher/ (MIT licence). It plays the browser game from the website; it never contains or downloads game data. Install: allow Install unknown apps for your browser or Files, then open the APK. Guide: https://leylinelauncher.com/wrath/mobile"
          fi
          gh release upload android-latest Leyline-debug.apk Leyline-debug.apk.sha256 $(ls Leyline.apk Leyline.apk.sha256 2>/dev/null) -R "$GITHUB_REPOSITORY" --clobber
