# Leyline launcher (launcher/): test the Rust core on every change; on a `launcher-v<version>` tag build the desktop
# app and attach it to the GitHub release for that tag:
#   Windows: setup .exe (NSIS) and .msi;   Linux: .AppImage and .deb;   macOS: one universal .dmg (unsigned).
# With the updater signing key in the repo's secrets ("setup\Turn on launcher updates.bat"), every build is also signed
# for Leyline's own updater and the release gets latest.json, the manifest the installed launchers read.
#
# Runs in the PUBLIC repo orionopenwow/Leyline (players can't download release files from the private
# WrathUnleashed repo, and a public repo's Actions minutes are free). Source copy: tools/github-workflows/ in
# WrathUnleashed; "setup\Turn on GitHub builds.bat" puts it in Leyline's .github/workflows/ and pushes the tag.
# No code signing yet (owner decision): Windows SmartScreen and macOS Gatekeeper warn on first run; the README
# says how to open it anyway.
#
# macOS never makes a run red: its test job and its release job are `continue-on-error` (a GitHub macOS runner
# outage turned a whole run red on 2026-10-26). A release without its .dmg can be completed by re-running the
# failed macOS job later.
#
# Every ship is a release for everyone (owner 31 Oct: "make sure any update to this launcher from now on is auto queued
# for restart update for everyone"): each push to main that changes launcher/ (the Leyline step pushes the export) gets
# the next version (launcher/scripts/release_version.py: one patch above the last launcher-v tag, or tauri.conf.json's
# version when that is higher), stamped into the build, and a normal (stable) release with latest.json, so every
# installed launcher downloads it in the background and offers Restart.
# A hand-pushed tag still works: its version (launcher-v0.3.0 -> 0.3.0) must match tauri.conf.json, and a version with
# a "-" (0.3.1-beta.1) is published as a pre-release, which only the opt-in early channel installs.
# One run at a time per kind (pull requests apart): a release is never made twice, and a run that finds its release
# already finished (latest.json there) builds nothing.
name: leyline launcher
on:
  # No `paths` filter on push: with one, GitHub can skip tag pushes, and the tag is what makes a release.
  push:
    tags: ["launcher-v*"]
    branches: [main]
  pull_request:
    paths:
      - "launcher/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leyline-launcher-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  # A push to main: does the launcher ship, and as which version (launcher/scripts/release_version.py).
  plan:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    outputs:
      ship: ${{ steps.p.outputs.ship }}
      version: ${{ steps.p.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Next launcher version
        id: p
        run: python3 launcher/scripts/release_version.py plan | tee -a "$GITHUB_OUTPUT"

  core-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ startsWith(matrix.os, 'macos') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: launcher/src-tauri
      - name: cargo test (core, no webview)
        working-directory: launcher/src-tauri
        run: cargo test --no-default-features

  # The simple way in (owner 2026-10-30: "why do we have to go through an installer? lets make this way simpler"):
  # every push to main builds one portable Leyline.exe (no installer: double-click and it runs; Windows 10 and 11 already
  # have the WebView2 it uses) and puts it on the rolling release "launcher-latest", always at the same address:
  #   https://github.com/orionopenwow/Leyline/releases/download/launcher-latest/Leyline.exe
  # "Open Leyline Launcher.bat" fetches it from there (the website can link it once the first build is up).
  portable:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.ship == 'true'
    needs: [core-tests, plan]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: launcher/src-tauri
      - name: This ship's version
        shell: bash
        run: python launcher/scripts/release_version.py stamp "${{ needs.plan.outputs.version }}"
      - name: Build Leyline.exe (no installer)
        working-directory: launcher
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npx tauri build --no-bundle
          cp src-tauri/target/release/leyline.exe ../Leyline.exe
      - name: Put it on launcher-latest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ver=$(python -c "import json;print(json.load(open('launcher/src-tauri/tauri.conf.json'))['version'])")
          notes="The newest Leyline launcher for Windows, built from main ($GITHUB_SHA, version $ver). One file, no installer: download Leyline.exe and double-click it. Not code-signed yet: Windows may ask once (More info, Run anyway). It updates itself. Leyline uses your own game client; it never offers or shares one."
          if gh release view launcher-latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit launcher-latest -R "$GITHUB_REPOSITORY" --title "Leyline launcher (latest, $ver)" --notes "$notes" --prerelease=false
          else
            gh release create launcher-latest -R "$GITHUB_REPOSITORY" --title "Leyline launcher (latest, $ver)" --notes "$notes" --target "$GITHUB_SHA" --latest=false
          fi
          gh release upload launcher-latest Leyline.exe -R "$GITHUB_REPOSITORY" --clobber

  create-release:
    # a launcher-v tag, or a ship from main (plan)
    if: >-
      !cancelled() && needs.core-tests.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/launcher-v') || needs.plan.outputs.ship == 'true')
    needs: [core-tests, plan]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      id: ${{ steps.r.outputs.id }}
      signed: ${{ steps.r.outputs.signed }}
      stamp: ${{ steps.r.outputs.stamp }}
      skip: ${{ steps.r.outputs.skip }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Make the release (once per tag)
        id: r
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHIP_VERSION: ${{ needs.plan.outputs.version }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          pre=""
          target=()
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
            ver="${TAG#launcher-v}"
            conf=$(python3 -c "import json;print(json.load(open('launcher/src-tauri/tauri.conf.json'))['version'])")
            if [ "$ver" != "$conf" ]; then
              echo "::error::The tag says $ver but launcher/src-tauri/tauri.conf.json says $conf. Tag the version in the file."
              exit 1
            fi
            case "$ver" in *-*) pre="--prerelease" ;; esac
            echo "stamp=" >> "$GITHUB_OUTPUT"
          else
            # a ship from main: always a normal release, so every installed launcher gets it
            ver="$SHIP_VERSION"
            TAG="launcher-v$ver"
            target=(--target "$GITHUB_SHA")
            echo "stamp=$ver" >> "$GITHUB_OUTPUT"
          fi
          skip=false
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # made by the other kind of run already: finished when its updater manifest is there
            if gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx latest.json; then skip=true; fi
          else
            awk -v v="$ver" '$0 ~ "^## "v"( |$)" {on=1; next} /^## / {if (on) exit} on' launcher/CHANGELOG.md > notes.md || true
            [ -s notes.md ] || echo "The newest Leyline. Installed launchers download it by themselves: press Restart when it says Update ready, or it finishes the next time Leyline opens." > notes.md
            {
              echo
              echo "Builds are not code-signed yet: on Windows choose \"More info, Run anyway\"; on macOS right-click Leyline and choose Open (see launcher/README.md)."
              echo "Leyline uses your own game client. It never offers or shares one."
            } >> notes.md
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Leyline $ver" --notes-file notes.md $pre "${target[@]}"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "id=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"
          pk=$(python3 -c "import json;print(json.load(open('launcher/src-tauri/tauri.conf.json'))['plugins']['updater']['pubkey'])")
          if [ "$HAS_KEY" = "true" ] && [ "${pk#TODO}" = "$pk" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No updater signing (secret TAURI_SIGNING_PRIVATE_KEY and the public key in tauri.conf.json are both needed: run 'setup\Turn on launcher updates.bat'). Installed launchers will only link to this release."
          fi

  release:
    needs: create-release
    if: needs.create-release.outputs.skip != 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis,msi"
          - platform: ubuntu-22.04
            args: "--bundles appimage,deb"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Linux webview libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: launcher/src-tauri
      - name: This ship's version
        if: needs.create-release.outputs.stamp != ''
        shell: bash
        run: $(command -v python3 || command -v python) launcher/scripts/release_version.py stamp "${{ needs.create-release.outputs.stamp }}"
      - name: Install the Tauri CLI
        working-directory: launcher
        run: npm install
      - name: Updater signing on or off
        id: sign
        shell: bash
        run: |
          if [ "${{ needs.create-release.outputs.signed }}" = "true" ]; then
            # a file next to tauri's own config (the build runs in launcher/), not JSON on the command line
            echo '{"bundle":{"createUpdaterArtifacts":true}}' > launcher/updater.conf.json
            echo "args=--config updater.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: launcher
          releaseId: ${{ needs.create-release.outputs.id }}
          includeUpdaterJson: ${{ needs.create-release.outputs.signed == 'true' }}
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} ${{ steps.sign.outputs.args }}

  release-macos:
    needs: create-release
    if: needs.create-release.outputs.skip != 'true'
    runs-on: macos-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: launcher/src-tauri
      - name: This ship's version
        if: needs.create-release.outputs.stamp != ''
        shell: bash
        run: $(command -v python3 || command -v python) launcher/scripts/release_version.py stamp "${{ needs.create-release.outputs.stamp }}"
      - name: Install the Tauri CLI
        working-directory: launcher
        run: npm install
      - name: Updater signing on or off
        id: sign
        shell: bash
        run: |
          if [ "${{ needs.create-release.outputs.signed }}" = "true" ]; then
            # a file next to tauri's own config (the build runs in launcher/), not JSON on the command line
            echo '{"bundle":{"createUpdaterArtifacts":true}}' > launcher/updater.conf.json
            echo "args=--config updater.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: launcher
          releaseId: ${{ needs.create-release.outputs.id }}
          includeUpdaterJson: ${{ needs.create-release.outputs.signed == 'true' }}
          args: --target universal-apple-darwin --bundles app,dmg ${{ steps.sign.outputs.args }}
