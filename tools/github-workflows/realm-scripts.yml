# WrathUnleashed: test the realm Lua scripts on every push, and deploy the changed ones to the live realm
# (live "reload ale", no restart; luaup.sh backs up each file and puts the old ones back if the reload fails).
# The deploy key is restricted to one command on the server (server/luaup-ci.sh): no shell, scripts in only.
# Owner's standing rule (2026-10-24): Claude may push and deploy to the live realm once tests pass.
# Needs two repository secrets, set once by "setup\Set up automatic deploys.bat": WU_DEPLOY_SSH_KEY, WU_KNOWN_HOSTS.
name: realm scripts
on:
  push:
    branches: [main]
    paths:
      - "realm/custom/lua_scripts/**"
      - "stream/lua/ov_slices.lua"
      - "stream/tests/**"
      - "realm/luaup.sh"
      - "server/luaup-ci.sh"
      - ".github/workflows/realm-scripts.yml"
  pull_request:
    paths:
      - "realm/custom/lua_scripts/**"
      - "stream/lua/**"
      - "stream/tests/**"
  workflow_dispatch:
concurrency:
  group: realm-deploy
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      - name: ov_slices (realm rule, Dungeon Finder gate)
        run: |
          python3 -I stream/lua/tiers_lua.py stream/slices/mini.json > /tmp/tiers.lua
          lua5.1 stream/tests/test_ov_slices.lua stream/lua/ov_slices.lua /tmp/tiers.lua realm/custom/lua_scripts/ov_main.lua
      - name: ov_reports (.bug, .stuck, .wu)
        run: lua5.1 stream/tests/test_ov_reports.lua realm/custom/lua_scripts/ov_reports.lua
      - name: ov_companions (.recruit, .buddy, .dismiss) and the Bots window
        run: |
          lua5.1 stream/tests/test_ov_companions.lua realm/custom/lua_scripts/ov_companions.lua
          lua5.1 stream/tests/test_wuui_companions.lua
      - name: ov_build (.build, the Builder) and its window
        run: |
          lua5.1 stream/tests/test_ov_build.lua realm/custom/lua_scripts/ov_build.lua
          lua5.1 stream/tests/test_wuui_builder.lua
      - name: ov_workshop (the Workshop) and its tab
        run: |
          lua5.1 stream/tests/test_ov_workshop.lua realm/custom/lua_scripts
          lua5.1 stream/tests/test_wuui_workshop.lua
      - name: ov_playmode (one click to play a mode) and the launcher's LeylinePlay addon
        run: lua5.1 stream/tests/test_ov_playmode.lua realm/custom/lua_scripts launcher/src-tauri/src/modes/LeylinePlay.lua
      - name: ov_main (the new character's choice menu, Goodbye kept)
        run: lua5.1 stream/tests/test_ov_main_choice.lua realm/custom/lua_scripts/ov_main.lua
      - name: ov_modes and ov_golf (Leyline Modes, minigolf) and their windows
        run: |
          lua5.1 stream/tests/test_ov_modes.lua stream/fui-web/Interface/AddOns/WrathUnleashedUI realm/custom/lua_scripts
          lua5.1 stream/tests/test_ov_golf.lua stream/fui-web/Interface/AddOns/WrathUnleashedUI realm/custom/lua_scripts
      - name: ov_den (the Den), and its smoke test (buildings, paths, restart, the save file, relaunch, invite)
        run: |
          lua5.1 stream/tests/test_ov_den.lua realm/custom/lua_scripts/ov_den.lua realm/custom/lua_scripts/ov_build.lua realm/custom/lua_scripts/ov_modapi.lua
          lua5.1 stream/tests/test_den_smoke.lua realm/custom/lua_scripts
      - name: ov_hostctl (Your realm, for the realm's GM) and the in-game Host window, Realm List, the Leyline look
        run: |
          lua5.1 stream/tests/test_wuui_host.lua
          lua5.1 stream/tests/test_wuui_leyline.lua
          lua5.1 stream/tests/test_ov_leyline.lua
      - name: ov_admin (the Admin Console's console words)
        run: lua5.1 stream/tests/test_ov_admin.lua realm/custom/lua_scripts
      - name: ov_discord (World chat bridge, game side)
        run: lua5.1 hosting/tests/test_ov_discord.lua realm/custom/lua_scripts/ov_discord.lua
      - name: every realm script parses
        run: for f in realm/custom/lua_scripts/*.lua stream/lua/ov_slices.lua; do luac5.1 -p "$f" || exit 1; done
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: changed scripts
        id: changed
        run: |
          base="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            files=$(ls realm/custom/lua_scripts/ov_main.lua realm/custom/lua_scripts/ov_reports.lua stream/lua/ov_slices.lua)
          else
            files=$(git diff --name-only "$base" "${{ github.sha }}" -- realm/custom/lua_scripts/ stream/lua/ov_slices.lua | grep '\.lua$' || true)
          fi
          echo "$files"
          mkdir -p /tmp/up && for f in $files; do [ -f "$f" ] && cp "$f" /tmp/up/; done
          echo "count=$(ls /tmp/up | wc -l)" >> "$GITHUB_OUTPUT"
      - name: deploy (reload ale)
        if: steps.changed.outputs.count != '0'
        env:
          KEY: ${{ secrets.WU_DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.WU_KNOWN_HOSTS }}
        run: |
          [ -n "$KEY" ] || { echo "No WU_DEPLOY_SSH_KEY secret yet: run 'setup\Set up automatic deploys.bat' once."; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          # The deploy key can only run /srv/wrath/luaup-ci.sh (forced command in authorized_keys, server/luaup-ci.sh):
          # a tar of scripts the realm already runs goes in on stdin; it checks them and reloads them live (luaup.sh).
          tar -cf /tmp/up.tar -C /tmp/up .
          ssh -i ~/.ssh/deploy -o BatchMode=yes -T root@play.openvanilla.app < /tmp/up.tar 2>&1 | tee /tmp/wu-luaup.log
          grep -q "^LUAUP OK" /tmp/wu-luaup.log
          rm -f ~/.ssh/deploy
