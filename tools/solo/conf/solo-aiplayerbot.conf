# Leyline Solo: the companions (the playerbots module) on top of its own aiplayerbot.conf.dist.
# A quiet world: no random bots anywhere (no bot accounts made, none logged in, none queueing for groups or
# battlegrounds); the player's own companions only, made and invited with the module's chat commands
# (".bot group", ".bot add <name>": docs/LEYLINE-SOLO-PHASE0.md). No chat model calls (everything stays offline).
AiPlayerbot.Enabled = 1
AiPlayerbot.RandomBotAutologin = 0
AiPlayerbot.RandomBotLoginAtStartup = 0
AiPlayerbot.RandomBotAutoCreate = 0
AiPlayerbot.MinRandomBots = 0
AiPlayerbot.MaxRandomBots = 0
AiPlayerbot.RandomBotAccountCount = 0
AiPlayerbot.DeleteRandomBotAccounts = 0
AiPlayerbot.RandomBotJoinLfg = 0
AiPlayerbot.RandomBotJoinBG = 0
AiPlayerbot.RandomBotAutoJoinBG = 0
AiPlayerbot.BotAutologin = 0
AiPlayerbot.LLMEnabled = 0
