# Leyline Solo (docs/LEYLINE-SOLO-PHASE0.md): the world server's settings on top of the core's own mangosd.conf.dist.
# solo_proof.py applies every "Key = Value" line here to a copy of mangosd.conf.dist, then the paths and the
# database logins of this PC (DataDir, LogsDir, *DatabaseInfo). Comments stay on their own lines (the core's
# config reader has no comments after a value).

# Only this PC: the world server listens on the PC's own loopback address, nothing from the network reaches it.
BindIP = "127.0.0.1"
WorldServerPort = 8085
RealmID = 1
# No console, no remote admin port (a background program with logs). SOAP is on, on 127.0.0.1 only, for the clean
# stop: solo_proof.py sends "server shutdown" as the local stop account SOLOSTOP (it never plays).
Console.Enable = 0
Ra.Enable = 0
SOAP.Enabled = 1
SOAP.IP = "127.0.0.1"
SOAP.Port = 7878
# A normal (not player-versus-player) world for one player and their companions.
GameType = 0
MaxPlayerLevel = 60
StartPlayerLevel = 1
PlayerLimit = 10
# Experience: 2x for now. TODO(owner): the Solo experience rate.
Rate.XP.Kill = 2
Rate.XP.Quest = 2
Rate.XP.Explore = 2
Motd = "Welcome to Leyline Solo."
